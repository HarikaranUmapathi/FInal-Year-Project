<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <nav class="flex flex-row text-xl justify-between">
        <h1>Admin Page</h1>
        <a href="/College_Department/CSE.html">CSE</a>
        <a href="/College_Department/IT.html">IT</a>
        <a href="/College_Department/Mechanical.html">MECHANICAL</a>
        <a href="/College_Department/Civil.html">CIVIL</a>
        <a href="/College_Department/MBA.html">MBA</a>
        <a href="/College_Department/MCA.html">MCA</a>
        <a href="./College_Department/EEE.html">EEE</a>
        <a href="/College_Department/ECE.html">ECE</a>
        <a href="/College_Department/AIML.html">AIML</a>
        <a href="/College_Department/FirstYear.html">FIRST YEAR</a>
        <a href="/College_Department/AIDS.html">AIDS</a>
        <a href="/Login.html">Logout</a>
    </nav>

    <div class="flex flex-row  mt-[100px] ml-[100px] text-xl">
        <div class="m-4">
            <label>Name</label>
            <input class="border-2 border-red-400" type="text" required name="Name">
        </div>
        <div class="m-4">
            <label>Password</label>
            <input type="password" class="border-2 border-red-400"  required name="Password">
        </div>
        <div class="m-4" >
            <label>Role</label>
            <select class="border-2 border-red-500 w-[190px]">
                <option value="faculty">Faculty</option>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>
    </div>

    <div class="flex flex-row m-4 ml-[100px] text-xl ">
        <div class="m-4">
            <label>Select Year</label>
            <select name="Year" class="border-2 border-red-400  mb-2  w-[90px]">
                <option value="1">I</option>
                <option value="2">II</option>
                <option value="3">III</option>
                <option value="4">IV</option>
            </select>
        </div>
        <div class=" m-4">
            <label>Select Department</label>
            <select name="Department" class="border-2 border-red-400 mb-3 ">
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
                 <option value="MBA">MBA</option>
                <option value="MCA">MCA</option>
                <option value="IT">IT</option>
                <option value="EEE">EEE</option>
                <option value="AIML">AIML</option>
                <option value="AIDS">AIDS</option>
                <option value="FIRSTYEAR">FIRSTYEAR</option>
                    
            </select>
        </div>

        <div class="m-4">
            <button type="submit" class="border-2 border-red-500 bg-blue-700 p-1">ADD</button>
        </div>
    </div>
    
</body>
</html>
