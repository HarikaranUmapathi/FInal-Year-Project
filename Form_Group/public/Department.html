<!DOCTYPE html>
<html lang="en">
<head>

<body>

                    <option value="EEE">EEE</option>

                </select>
            </div>
            <div>
                <button class="border-2 border-blue-400 p-1 bg-blue-700">Submit</button>
            </div>
