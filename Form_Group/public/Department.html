<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;

        body {

            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;

            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);

            width: 100%;
            margin: 2rem;

        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            transition: all 0.3s;
        }

        .select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .analytics-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;

            border: 2px solid #667eea;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .analytics-link:hover {

            transform: translateY(-1px);

    <div class="container">
        <h1 class="title">Department Selection</h1>
        <form action="./redirect.php" method="post">
            <div class="form-group">
                <label class="label" for="year">Select Year</label>
                <select name="Year" id="year" class="select" required>
                    <option value="1">I Year</option>
                    <option value="2">II Year</option>
                    <option value="3">III Year</option>
                    <option value="4">IV Year</option>
                </select>
            </div>

            <div class="form-group">
                <label class="label" for="department">Select Department</label>
                <select name="Department" id="department" class="select" required>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="ECE">Electronics & Communication Engineering</option>
                    <option value="MECH">Mechanical Engineering</option>
                    <option value="CIVIL">Civil Engineering</option>
                    <option value="MBA">Master of Business Administration</option>
                    <option value="MCA">Master of Computer Applications</option>
                    <option value="IT">Information Technology</option>
                    <option value="EEE">Electrical & Electronics Engineering</option>
                    <option value="AIML">Artificial Intelligence & Machine Learning</option>
                    <option value="AIDS">AI & Data Science</option>
                    <option value="FIRSTYEAR">First Year</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Continue to Dashboard</button>
        </form>

        <a href="Analytics.php" class="analytics-link">Go to Analytics (Admin/Faculty Only)</a>
